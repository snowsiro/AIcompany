<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Anton"; src: url("../assets/fonts/Anton-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Inter Tight"; src: url("../assets/fonts/InterTight-Variable.woff2") format("woff2"); font-weight: 100 900; }

  :root {
    --ink: #0A0A0C;
    --paper: #F5F5F0;
    --muted: #9A9AA2;
    --accent: #FFD23F;
    --line: #2A2A30;
    --pad: 72px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: var(--ink); }
  body { font-family: "Inter Tight", sans-serif; color: var(--paper); -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--ink); }
  em { font-style: normal; color: var(--accent); }

  /* ---------- cover ---------- */
  .cover .bg { position: absolute; inset: 0 0 auto 0; height: 960px; background-size: cover; background-position: center top; }
  .cover .bg.fallback {
    background:
      radial-gradient(circle at 70% 30%, rgba(255,210,63,.55), transparent 38%),
      radial-gradient(circle at 25% 55%, rgba(64,120,255,.45), transparent 45%),
      linear-gradient(180deg, #15151c, #0A0A0C);
  }
  .cover .bg.fallback::after {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
    background-size: 54px 54px;
  }
  .cover .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,12,0) 30%, rgba(10,10,12,.55) 52%, var(--ink) 70%); }
  .cover .text { position: absolute; left: var(--pad); right: var(--pad); bottom: 150px; }
  .tag {
    display: inline-block; font-weight: 700; font-size: 26px; letter-spacing: .14em;
    padding: 10px 22px; border: 2px solid rgba(245,245,240,.6); border-radius: 999px; margin-bottom: 30px;
  }
  .cover h1 {
    font-family: "Anton", sans-serif; font-weight: 400; text-transform: uppercase;
    font-size: 150px; line-height: .95; letter-spacing: .005em;
  }
  .cover h1 span { display: block; white-space: nowrap; width: max-content; }
  .handle { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font-weight: 700; font-size: 28px; letter-spacing: .06em; color: var(--paper); opacity: .9; }

  /* ---------- body slides ---------- */
  .slide { padding: var(--pad); display: flex; flex-direction: column; }
  .slide > * { position: relative; z-index: 1; }
  /* Decoration lives in the empty top-right corner, away from the text. */
  .slide > .deco { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .deco .glow { position: absolute; inset: 0; background: radial-gradient(circle at 96% 4%, rgba(255,210,63,.16), transparent 34%); }
  .deco .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(245,245,240,.22) 1.6px, transparent 2px);
    background-size: 36px 36px; background-position: 18px 18px;
    -webkit-mask-image: radial-gradient(circle at 100% 0%, #000 0, transparent 46%);
  }
  .deco .num {
    position: absolute; right: 72px; top: 150px;
    font-family: "Anton", sans-serif; font-size: 300px; line-height: 1;
    color: transparent; -webkit-text-stroke: 2px rgba(245,245,240,.13);
  }
  .kicker { display: flex; justify-content: space-between; align-items: center; gap: 24px; font-weight: 700; font-size: 26px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; padding-bottom: 28px; border-bottom: 2px solid var(--line); }
  .kicker b { color: var(--accent); font-weight: 700; }
  .kicker span { white-space: nowrap; }
  .kicker .pill { font-size: 20px; letter-spacing: .12em; color: var(--paper); padding: 7px 16px; border: 2px solid var(--line); border-radius: 999px; }
  .content { flex: 1; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .bar { width: 72px; height: 8px; border-radius: 4px; background: var(--accent); margin-bottom: 32px; flex: none; }
  .slide h2 { font-weight: 800; font-size: 76px; line-height: 1.04; letter-spacing: -.02em; margin-bottom: 44px; }
  .slide p { font-weight: 500; font-size: 44px; line-height: 1.36; letter-spacing: -.005em; color: var(--paper); }
  .slide p + p { margin-top: 28px; }
  .slide .qmark { font-family: "Anton", sans-serif; font-size: 240px; line-height: .8; height: 104px; color: var(--accent); }
  .slide .quote { font-weight: 600; font-size: 54px; line-height: 1.25; }
  .slide .who { display: flex; align-items: center; gap: 18px; margin-top: 36px; font-size: 32px; color: var(--muted); font-weight: 600; }
  .slide .who::before { content: ""; width: 40px; height: 3px; background: var(--accent); flex: none; }
  .footer { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 26px; letter-spacing: .06em; color: var(--muted); padding-top: 28px; border-top: 2px solid var(--line); }
  .dots { display: flex; gap: 10px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); display: block; }
  .dots i.on { background: var(--accent); }

  /* ---------- last slide: follow + sources ---------- */
  .end h2 { font-size: 92px; line-height: 1.0; margin-bottom: 28px; }
  .end .sub { font-size: 40px; color: var(--muted); }
  .cta {
    display: flex; justify-content: space-between; align-items: center; gap: 24px;
    margin-top: 56px; padding: 36px 40px; border: 2px solid var(--line); border-radius: 32px;
    background: linear-gradient(135deg, rgba(255,210,63,.10), rgba(255,210,63,0) 60%);
  }
  .cta .line { font-weight: 800; font-size: 46px; letter-spacing: -.01em; }
  .cta .btn {
    display: inline-flex; align-items: center; gap: 12px; padding: 18px 32px; flex: none;
    border-radius: 999px; background: var(--accent); color: var(--ink);
    font-weight: 800; font-size: 28px; letter-spacing: .08em; text-transform: uppercase;
  }
  .actions { display: flex; gap: 40px; margin-top: 36px; font-weight: 600; font-size: 30px; color: var(--muted); }
  .actions span { display: inline-flex; align-items: center; gap: 12px; }
  .srcs { padding-bottom: 28px; }
  .srcs .lab { font-weight: 700; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .srcs p { display: flex; gap: 14px; font-weight: 500; font-size: 24px; line-height: 1.35; color: var(--muted); }
  .srcs p + p { margin-top: 10px; }
  .srcs p b { font-weight: 700; color: var(--paper); }
  .srcs svg { flex: none; width: 28px; height: 28px; margin-top: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // **word** -> <em>word</em>; everything else escaped.
  function rich(s) {
    const esc = String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return esc.replace(/\*\*(.+?)\*\*/g, "<em>$1</em>");
  }
  function dots(i, n) { return Array.from({ length: n }, (_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join(""); }
  function pad2(n) { return String(n).padStart(2, "0"); }
  function deco(n) { return `<div class="deco"><div class="glow"></div><div class="grid"></div><div class="num">${pad2(n)}</div></div>`; }
  function kicker(i, n, label, tag) {
    return `<div class="kicker" data-fit><span>${pad2(i + 1)} / ${pad2(n)} · <b>${label}</b></span><span class="pill">${tag}</span></div>`;
  }
  const DOC_ICON = `<svg viewBox="0 0 40 40" fill="none" stroke="#FFD23F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h15l7 7v25H9z"/><path d="M24 4v7h7"/><path d="M14 20h12M14 26h12M14 32h7"/></svg>`;
  const SAVE_ICON = `<svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#9A9AA2" stroke-width="2.6" stroke-linejoin="round"><path d="M7 4h16v22l-8-6-8 6z"/></svg>`;
  const SHARE_ICON = `<svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#9A9AA2" stroke-width="2.6" stroke-linejoin="round"><path d="M27 3 3 13l10 4 4 10z"/><path d="M27 3 13 17"/></svg>`;
  const PLUS_ICON = `<svg width="22" height="22" viewBox="0 0 22 22" stroke="#0A0A0C" stroke-width="3.4" stroke-linecap="round"><path d="M11 3v16M3 11h16"/></svg>`;

  window.renderCard = function (post, index, coverUrl) {
    const total = post.slides.length + 2; // cover + body slides + sources
    const root = document.getElementById("root");
    const handle = "@ai.news.company";

    if (index === 0) {
      const c = post.cover;
      const bg = coverUrl ? `<div class="bg" style="background-image:url('${coverUrl}')"></div>` : `<div class="bg fallback"></div>`;
      root.innerHTML = `
        <div class="card cover">
          ${bg}<div class="shade"></div>
          <div class="text">
            <div class="tag">${rich(c.tag)}</div>
            <h1>${c.headline.map(l => `<span>${rich(l)}</span>`).join("")}</h1>
          </div>
          <div class="handle">${handle}</div>
        </div>`;
      fitCover();
      return;
    }

    if (index === total - 1) {
      const srcs = post.sources.slice(0, 3).map(s =>
        `<p>${DOC_ICON}<span><b>${rich(s.outlet)}</b>, “${rich(s.title)}” (${rich(s.date)})</span></p>`).join("");
      root.innerHTML = `
        <div class="card slide end">
          ${deco(index + 1)}
          ${kicker(index, total, "Follow", rich(post.cover.tag))}
          <div class="content" data-fit>
            <div class="bar"></div>
            <h2>Never miss a day<br>of <em>AI news.</em></h2>
            <p class="sub">Two stories a day, from around the world.</p>
            <div class="cta">
              <div class="line">${handle}</div>
              <div class="btn">${PLUS_ICON}Follow</div>
            </div>
            <div class="actions"><span>${SAVE_ICON}Save for later</span><span>${SHARE_ICON}Share with a friend</span></div>
          </div>
          <div class="srcs"><div class="lab">Source${post.sources.length > 1 ? "s" : ""}</div>${srcs}</div>
          <div class="footer"><span>${handle}</span><span class="dots">${dots(index, total)}</span></div>
        </div>`;
      return;
    }

    const s = post.slides[index - 1];
    const body = s.quote
      ? `<div class="qmark">“</div><p class="quote">${rich(s.quote)}</p><p class="who">${rich(s.who)}</p>`
      : s.body.map(p => `<p>${rich(p)}</p>`).join("");
    root.innerHTML = `
      <div class="card slide">
        ${deco(index + 1)}
        ${kicker(index, total, rich(s.kicker), rich(post.cover.tag))}
        <div class="content" data-fit>
          ${s.title ? `<div class="bar"></div><h2>${rich(s.title)}</h2>` : ""}${body}
        </div>
        <div class="footer"><span>${handle}</span><span class="dots">${dots(index, total)}</span></div>
      </div>`;
  };

  // Shrink the cover headline until the widest line fits the safe area (max 150px, min 96px).
  window.fitCover = fitCover;
  function fitCover() {
    const h1 = document.querySelector(".cover h1");
    const max = 1080 - 2 * 72;
    for (let size = 150; size >= 96; size -= 2) {
      h1.style.fontSize = size + "px";
      const widest = Math.max(...[...h1.children].map(s => s.getBoundingClientRect().width));
      if (widest <= max) return;
    }
  }

  // Overflow check used by the renderer as an automatic visual QC step.
  window.checkFit = function () {
    const problems = [];
    document.querySelectorAll("[data-fit]").forEach(el => {
      if (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1) problems.push("text overflows its box");
    });
    const h1 = document.querySelector(".cover h1");
    if (h1) {
      const top = h1.getBoundingClientRect().top;
      if (top < 760) problems.push("cover headline too tall: starts at y=" + Math.round(top));
      const widest = Math.max(...[...h1.children].map(s => s.getBoundingClientRect().width));
      if (widest > 1080 - 2 * 72 + 1) problems.push("cover headline line too wide even at 96px: shorten it");
    }
    return problems;
  };
</script>
</body>
</html>
