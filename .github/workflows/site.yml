name: site

# Builds the link-in-bio page and the weekly digest (scripts/site.mjs) and deploys them to GitHub Pages.
# Needs Pages turned on once: Settings > Pages > Source: GitHub Actions.
# Runs after every publish run (bot commits made with GITHUB_TOKEN don't trigger push workflows), on config or
# script changes, and once a day as a backup because GitHub's schedule is unreliable in this repo.
on:
  workflow_run:
    workflows: [publish]
    types: [completed]
  push:
    branches: [main]
    paths: ["config/site.json", "scripts/site.mjs", ".github/workflows/site.yml"]
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/site.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
