name: render

# On every PR that touches a post: check the rules, render the slides with the real cover image,
# and commit the JPEGs back to the PR so they can be reviewed on a phone.
on:
  pull_request:
    paths: ["posts/**", "templates/**", "scripts/**", "DESIGN.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04  # ubuntu-latest moved to 26.04 (2026-10), which Playwright 1.56 does not support
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Rule check
        run: npm run lint
      # Only posts not yet published (2026-11-02): re-rendering published posts after a template change
      # rewrote slides that no longer match what Instagram shows, in every PR.
      - name: Pick posts
        run: |
          dirs=$(for d in posts/2*/; do d=${d%/}; [ "$(jq -r '.status // ""' "$d/post.json" 2>/dev/null)" = published ] || echo "$d"; done; true)
          echo "POSTS=$(echo $dirs)" >> "$GITHUB_ENV"
          echo "posts to render: ${dirs:-none}"
      - name: Render
        if: env.POSTS != ''
        env:
          REQUIRE_COVER: "1"
        run: node scripts/render.mjs $POSTS
      # 9:16 Reel video from the same slides (added 2026-10-22), for posts from that day on. ffmpeg only, no credits.
      - name: Reel video
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          dirs=$(for d in $POSTS; do [[ "$(basename "$d")" > "2026-10-22" ]] && echo "$d"; done; true)
          [ -z "$dirs" ] || node scripts/reel.mjs $dirs
      # 9:16 Story image from the cover slide (PRD 2026-11-01), for posts from 2026-11-02 on. Playwright, no credits.
      - name: Story image
        run: |
          dirs=$(for d in $POSTS; do [[ "$(basename "$d")" > "2026-11-02" ]] && echo "$d"; done; true)
          [ -z "$dirs" ] || node scripts/story.mjs $dirs
      - name: Commit rendered slides
        run: |
          git config user.name "ai-office-bot"
          git config user.email "ai-office-bot@users.noreply.github.com"
          git add posts/*/slides posts/*/cover.*
          git add posts/*/reel.mp4 2>/dev/null || true
          git add posts/*/story.jpg 2>/dev/null || true
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "render: update slides [skip ci]"
          git push
