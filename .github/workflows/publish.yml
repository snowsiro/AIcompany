name: publish

# Posts the oldest merged post with "status": "ready" to Instagram.
# Runs twice a day (turned on 2026-10-20 by Jamie) and can also be run by hand.
# GitHub can start scheduled runs hours late (on 2026-10-21 the 03:07 scan ran at 08:28 and the 11:57 publish
# didn't run), so Claude also starts this workflow at each slot. Two guards keep that to one post per slot:
# a scheduled run more than 60 minutes late skips, and any run skips if something was published in the last 3 hours.
# Sundays at 09:57 Vienna there is a third slot for the weekly roundup (PRD 2026-10-26). It posts only that Sunday's
# posts/<date>-weekly and records it as "weekly: ", so it has its own 3-hour guard and never holds back the 13:57 post.
# Re-running a failed run is safe (2026-10-26, after one post went up 6 times): ig.mjs publish first looks for the post
# among our latest posts and only records it if it is already live, and "Record result" runs even when Publish failed.
on:
  workflow_dispatch:
    inputs:
      post:
        description: "Post folder to publish, e.g. posts/2026-10-21-some-slug (blank = oldest ready post)"
        required: false
  # Two posts a day, at 13:57 and 19:57 Vienna time all year.
  # Cron runs in UTC, so each slot has a summer and a winter entry; the "Pick post" step skips
  # the one that doesn't match Vienna's current UTC offset.
  # A few minutes before the hour, because GitHub delays jobs scheduled exactly on the hour.
  schedule:
    - cron: "57 11 * * *"   # summer: 13:57 Vienna (UTC+2)
    - cron: "57 12 * * *"   # winter: 13:57 Vienna (UTC+1)
    - cron: "57 17 * * *"   # summer: 19:57 Vienna
    - cron: "57 18 * * *"   # winter: 19:57 Vienna
    - cron: "57 7 * * 0"    # summer: Sunday 09:57 Vienna, weekly roundup
    - cron: "57 8 * * 0"    # winter: Sunday 09:57 Vienna, weekly roundup

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04  # ubuntu-latest moved to 26.04 (2026-10); pinned like render.yml
    steps:
      # Latest main, not the commit the run was queued on: a run waiting behind another must see its publish record.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick post
        id: pick
        run: |
          weekly_slot=no
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "57 11 * * *"|"57 17 * * *"|"57 7 * * 0") want=+0200 ;;
              *) want=+0100 ;;
            esac
            case "${{ github.event.schedule }}" in "57 7 * * 0"|"57 8 * * 0") weekly_slot=yes ;; esac
            if [ "$(TZ=Europe/Vienna date +%z)" != "$want" ]; then
              echo "other season's slot, skipping"; echo "dir=" >> "$GITHUB_OUTPUT"; exit 0
            fi
            slot=$(date -u -d "$(echo "${{ github.event.schedule }}" | awk '{printf "%02d:%02d", $2, $1}')" +%s)
            late=$(( ($(date -u +%s) - slot + 86400) % 86400 / 60 ))
            if [ "$late" -gt 60 ]; then
              echo "started $late minutes after the slot, skipping"; echo "dir=" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.post }}" ]; then echo "dir=${{ inputs.post }}" >> "$GITHUB_OUTPUT"; exit 0; fi
          # A manual run without a post (e.g. Claude's backup start) is the weekly slot on Sunday before noon, Vienna time.
          if [ "${{ github.event_name }}" != "schedule" ] && [ "$(TZ=Europe/Vienna date +%u)" = 7 ] && [ "$(TZ=Europe/Vienna date +%-H)" -lt 12 ]; then
            weekly_slot=yes
          fi
          if [ "$weekly_slot" = yes ]; then
            # Only today's roundup. One that missed its Sunday is skipped for good, never posted a week late.
            if [ -n "$(git log --since='3 hours ago' --grep='^weekly: ' --format=%h)" ]; then
              echo "weekly roundup already published, skipping"; echo "dir=" >> "$GITHUB_OUTPUT"; exit 0
            fi
            d="posts/$(TZ=Europe/Vienna date +%F)-weekly"
            if [ -f "$d/post.json" ] && grep -q '"kind": "weekly"' "$d/post.json" && grep -q '"status": "ready"' "$d/post.json"; then
              echo "dir=$d" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "no ready weekly roundup for today; single posts wait for 13:57"; echo "dir=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "$(git log --since='3 hours ago' --grep='^publish: ' --format=%h)" ]; then
            echo "already published in this slot, skipping"; echo "dir=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for d in $(ls -d posts/2*/ | sort); do
            grep -q '"kind": "weekly"' "$d/post.json" && continue
            if grep -q '"status": "ready"' "$d/post.json"; then echo "dir=${d%/}" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "nothing ready to publish"; echo "dir=" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.pick.outputs.dir != ''
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/ig.mjs publish "${{ steps.pick.outputs.dir }}" "https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.pick.outputs.sha }}"
      # Threads follows Instagram with the same slides (added 2026-10-21). It never blocks or undoes the Instagram post:
      # on failure the run stays green and the next run retries it (catchup). Skips quietly until the THREADS_* secrets exist.
      - name: Cross-post to Threads
        if: steps.pick.outputs.dir != ''
        continue-on-error: true
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          base="https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.pick.outputs.sha }}"
          node scripts/threads.mjs publish "${{ steps.pick.outputs.dir }}" "$base" || echo "::warning::Threads post failed; the next run retries it"
          node scripts/threads.mjs catchup "$base" || echo "::warning::Threads retry failed"
      - name: Record result
        # always(): a post that went live before a later error must still be recorded, or the next run posts it again.
        if: always() && steps.pick.outputs.dir != ''
        run: |
          git config user.name "ai-office-bot"
          git config user.email "ai-office-bot@users.noreply.github.com"
          # One publish: commit records Instagram and Threads together, so the 3-hour guard sees one publish per slot.
          git add posts/*/post.json
          if git diff --cached --quiet; then echo "nothing to record"; exit 0; fi
          # "publish: " only when Instagram actually posted; a Threads-only run (e.g. a manual test on a post
          # that is already on Instagram) must not trip the 3-hour guard for the next slot.
          # The weekly roundup records as "weekly: ", so it never trips the single posts' guard (and the other way round).
          if git diff --cached -U0 -- "${{ steps.pick.outputs.dir }}/post.json" | grep -q '^+.*"published_id"'; then
            msg="publish: ${{ steps.pick.outputs.dir }}"
            grep -q '"kind": "weekly"' "${{ steps.pick.outputs.dir }}/post.json" && msg="weekly: ${{ steps.pick.outputs.dir }}"
          else
            msg="threads: ${{ steps.pick.outputs.dir }}"
          fi
          git commit -m "$msg"
          # The post is live now. If this record is lost, the next run would post it again, so retry the push.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          echo "::error::Posted to Instagram but could not record it in post.json. Set its status to published by hand before the next run."
          exit 1
      # Trial Reel of the same slides (added 2026-10-22). Runs only after the carousel is posted and recorded above,
      # so a Reel failure can never block or undo the carousel; the next run retries it (reel-catchup).
      # Commits as "reel: " so the 3-hour guard (^publish: ) keeps counting carousels only.
      - name: Trial Reel
        if: steps.pick.outputs.dir != ''
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          git pull --rebase origin main || true
          base="https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.pick.outputs.sha }}"
          dir="${{ steps.pick.outputs.dir }}"
          if [ -f "$dir/reel.mp4" ]; then node scripts/ig.mjs reel "$dir" "$base" || echo "::warning::Reel failed; the next run retries it"; fi
          node scripts/ig.mjs reel-catchup "$base" || echo "::warning::Reel retry failed"
          git add posts/*/post.json
          if git diff --cached --quiet; then echo "no reel recorded"; exit 0; fi
          git commit -m "reel: $dir"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          echo "::error::Reel posted but not recorded in post.json. Add reel_id by hand before the next run, or it posts again."
          exit 1
