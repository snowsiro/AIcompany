name: publish

# Posts the oldest merged post with "status": "ready" to Instagram.
# Runs twice a day (turned on 2026-10-20 by Jamie) and can also be run by hand.
# GitHub can start scheduled runs hours late (on 2026-10-21 the 03:07 scan ran at 08:28 and the 11:57 publish
# didn't run), so Claude also starts this workflow at each slot. Two guards keep that to one post per slot:
# a scheduled run more than 60 minutes late skips, and any run skips if something was published in the last 3 hours.
on:
  workflow_dispatch:
    inputs:
      post:
        description: "Post folder to publish, e.g. posts/2026-10-21-some-slug (blank = oldest ready post)"
        required: false
  # Two posts a day, at 13:57 and 19:57 Vienna time all year.
  # Cron runs in UTC, so each slot has a summer and a winter entry; the "Pick post" step skips
  # the one that doesn't match Vienna's current UTC offset.
  # A few minutes before the hour, because GitHub delays jobs scheduled exactly on the hour.
  schedule:
    - cron: "57 11 * * *"   # summer: 13:57 Vienna (UTC+2)
    - cron: "57 12 * * *"   # winter: 13:57 Vienna (UTC+1)
    - cron: "57 17 * * *"   # summer: 19:57 Vienna
    - cron: "57 18 * * *"   # winter: 19:57 Vienna

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Latest main, not the commit the run was queued on: a run waiting behind another must see its publish record.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick post
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "57 11 * * *"|"57 17 * * *") want=+0200 ;;
              *) want=+0100 ;;
            esac
            if [ "$(TZ=Europe/Vienna date +%z)" != "$want" ]; then
              echo "other season's slot, skipping"; echo "dir=" >> "$GITHUB_OUTPUT"; exit 0
            fi
            slot=$(date -u -d "$(echo "${{ github.event.schedule }}" | awk '{printf "%02d:%02d", $2, $1}')" +%s)
            late=$(( ($(date -u +%s) - slot + 86400) % 86400 / 60 ))
            if [ "$late" -gt 60 ]; then
              echo "started $late minutes after the slot, skipping"; echo "dir=" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.post }}" ]; then echo "dir=${{ inputs.post }}" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -n "$(git log --since='3 hours ago' --grep='^publish: ' --format=%h)" ]; then
            echo "already published in this slot, skipping"; echo "dir=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for d in $(ls -d posts/2*/ | sort); do
            if grep -q '"status": "ready"' "$d/post.json"; then echo "dir=${d%/}" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "nothing ready to publish"; echo "dir=" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.pick.outputs.dir != ''
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/ig.mjs publish "${{ steps.pick.outputs.dir }}" "https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.pick.outputs.sha }}"
      - name: Record result
        if: steps.pick.outputs.dir != ''
        run: |
          git config user.name "ai-office-bot"
          git config user.email "ai-office-bot@users.noreply.github.com"
          git add "${{ steps.pick.outputs.dir }}/post.json"
          git commit -m "publish: ${{ steps.pick.outputs.dir }}"
          # The post is live now. If this record is lost, the next run would post it again, so retry the push.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          echo "::error::Posted to Instagram but could not record it in post.json. Set its status to published by hand before the next run."
          exit 1
