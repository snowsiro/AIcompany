name: morning-scan

# Gathers what the 05:45 Vienna routine can't reach on its own, and commits it to main:
#   ops/scan/<date>/reference.json  reference accounts' posts from the last 48h (needs the Instagram token)
#   ops/scan/<date>/feeds.json      new AI articles from each outlet's RSS, or Google News RSS for that site
#   ops/metrics/<date>.json         our own posts' reach, saves, shares, follows + yesterday's account totals (added 2026-10-22)
# The researcher reads these files first. Read-only towards Instagram: it never posts.
on:
  schedule:
    - cron: "7 3 * * *"   # 03:07 UTC = 05:07 Vienna in summer, 04:07 in winter; before the 05:45 routine either way
  workflow_dispatch:
  # On a PR that changes the scan, run it as a check without committing anything.
  pull_request:
    paths: ["scripts/feeds.mjs", "scripts/ig.mjs", "scripts/article.mjs", ".github/workflows/morning-scan.yml", "config/sources.yaml"]

permissions:
  contents: write

concurrency:
  group: morning-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick folder
        id: day
        run: |
          echo "dir=ops/scan/$(TZ=Europe/Vienna date +%F)" >> "$GITHUB_OUTPUT"
          echo "metrics=ops/metrics/$(TZ=Europe/Vienna date +%F).json" >> "$GITHUB_OUTPUT"
      - name: Reference accounts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/ig.mjs scan "${{ steps.day.outputs.dir }}/reference.json"
      # The morning report and the 11-04 / 11-18 reviews read this. A failure here never stops the scan.
      - name: Our metrics
        if: always()
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/ig.mjs metrics "${{ steps.day.outputs.metrics }}"
      - name: News feeds
        if: always()
        run: node scripts/feeds.mjs "${{ steps.day.outputs.dir }}/feeds.json"
      - name: Article reader check
        # On a PR only: read the newest article from each outlet's own RSS, to see which sites the reader works on.
        if: always() && github.event_name == 'pull_request'
        run: |
          links=$(jq -r '.sources[] | select(.via == "rss") | .items[0].link // empty' "${{ steps.day.outputs.dir }}/feeds.json")
          ok=0; n=0
          for u in $links; do
            n=$((n + 1))
            if out=$(node scripts/article.mjs "$u"); then
              ok=$((ok + 1)); echo "ok   $u ($(echo "$out" | wc -w) words)"
            fi
          done
          echo "articles read: $ok/$n"
          [ "$ok" -gt 0 ]
      - name: Commit
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "ai-office-bot"
          git config user.email "ai-office-bot@users.noreply.github.com"
          git add "${{ steps.day.outputs.dir }}"
          git add ops/metrics 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "scan: ${{ steps.day.outputs.dir }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
